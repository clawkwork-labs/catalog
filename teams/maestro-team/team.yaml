id: maestro-team
name: Maestro Team
description: >
  A multi-agent team that replicates the Maestro persona as coordinated
  specialists. Maestro owns the orchestration loop — decomposing tasks,
  dispatching to the right agent, tracking progress, and integrating
  results. Nestor handles upfront planning and milestone tracking. Sage
  runs automation and tool-chaining. Argus covers research. Prism
  handles analysis and data work. Sol rolls up cross-agent status and
  routes incoming work. Janus observes signals and keeps the progress
  picture current.
category: general
featured: true

members:
  - persona_id: maestro
    role: owner
    name_suffix: "· Lead"

  - persona_id: nestor
    role: admin
    name_suffix: "· Planning"

  - persona_id: sage
    role: member
    name_suffix: "· Automation"

  - persona_id: argus
    role: member
    name_suffix: "· Research"

  - persona_id: prism
    role: member
    name_suffix: "· Analysis"

  - persona_id: sol
    role: member
    name_suffix: "· Rollup"

  - persona_id: janus
    role: observer
    name_suffix: "· Signals"

config:
  turn_max_rounds: 40
  budget_daily_usd: 25
  context_max_tokens: 200000
  tags:
    - orchestration
    - multi-agent
    - planning
    - automation
    - research
