id: maestro-team
name: Maestro Team
description: >
  The team-form of the Maestro persona — the same orchestration loop
  expressed as coordinated specialists rather than a single agent. Sol
  owns the coordination layer: routing incoming work, aggregating status,
  and surfacing cross-cutting decisions. Nestor handles upfront planning
  and milestone tracking. Sage runs automation and tool-chaining. Argus
  covers research. Prism handles data analysis. Arachne weaves all
  sub-results into a single coherent output. Janus observes signals
  and keeps the progress picture current.
category: general
featured: true

members:
  - persona_id: sol
    role: owner
    name_suffix: "· Orchestrator"

  - persona_id: nestor
    role: admin
    name_suffix: "· Planning"

  - persona_id: sage
    role: member
    name_suffix: "· Automation"

  - persona_id: argus
    role: member
    name_suffix: "· Research"

  - persona_id: prism
    role: member
    name_suffix: "· Analysis"

  - persona_id: arachne
    role: member
    name_suffix: "· Synthesis"

  - persona_id: janus
    role: observer
    name_suffix: "· Signals"

config:
  turn_max_rounds: 40
  budget_daily_usd: 25
  context_max_tokens: 200000
  tags:
    - orchestration
    - multi-agent
    - planning
    - automation
    - research
