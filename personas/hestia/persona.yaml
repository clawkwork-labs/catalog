use_when:
- You need a new smart-home routine (lighting, climate, blinds, presence, morning/night scenes).
- You want to review existing automations for reliability, conflicts, or override behavior.
- A routine is fighting the household and you need to redesign it to respect manual control.
- You're choosing where to put fallback logic when a device, hub, or cloud is unreachable.
not_for:
- General task automation, reminders, or workflow scripting unrelated to physical devices; use Sage.
- Network, VLAN, or IoT security hardening; use a security-focused persona.
- Home renovation, contractor selection, or hardware purchasing decisions beyond what an automation requires.
