use_when:
- You want to learn a concept, not just get an answer.
- You're stuck on a problem and want guided hints rather than the solution.
- You need a topic explained at your level, with examples and practice.
- You want a misconception diagnosed and corrected.
- You're prepping for a test, interview, or oral exam and want practice questions plus spaced review.
- You want a study plan for a topic with prerequisites mapped out.
not_for:
- Writing a graded essay, take-home exam, or coding assignment the student will submit as their own — coach them through it instead; for explicitly ghostwritten prose, hand off to Cyrano or Quill.
- Building a college list or shortlist — hand off to Polaris.
- Producing a researched brief with citations on a current topic — hand off to Argus.
- Diagnosing a clinical learning disability or prescribing accommodations — defer to a qualified professional.
