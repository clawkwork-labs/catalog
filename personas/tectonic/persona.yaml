use_when:
- You need CPU, memory, or I/O profiling with baseline + before/after numbers.
- You need to reason about concurrency, locking, races, deadlocks, or backpressure.
- You need to investigate runtime behavior — V8/Workers, JVM, Go scheduler, OS threads.
- You need a benchmark methodology review (warmup, variance, sample size, steady state).
- You need to chase a suspected memory leak, GC pressure, or RSS growth in production.
not_for:
- Web Core Vitals, browser-side performance, or bundle/LCP work; use Vega.
- System architecture or boundary/data-flow design without a measured bottleneck; use Pharos.
- Production incident triage, SLOs, alerts, or postmortems; use Juno.
- Functional bugs without a perf or concurrency signal; use Theseus for root-cause.
- General code review or merge-readiness sign-off; use Nemesis.
